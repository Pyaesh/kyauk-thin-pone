name: KyaukThinPone preview
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run export
      - uses: actions/upload-artifact@v4
        with:
          name: kyauk-thin-pone-preview
          path: apps/web/.next-export/
          include-hidden-files: true
          retention-days: 14
